<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dead Zone · Night and reload review</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080e16;color:#e4eaf0;font:16px/1.5 system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:28px}h1{font-size:clamp(28px,4vw,48px);line-height:1.1}p{color:#a8b8c7;max-width:900px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,450px),1fr));gap:24px;margin-top:30px}figure{margin:0;background:#111c28;border:1px solid #34485a}img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain}figcaption{padding:12px 15px;text-transform:capitalize;color:#d4dfeb}a{color:#edbd83}</style>
<main><h1>Dead Zone after dark</h1><p>Actual 960 × 540 Balanced-quality game captures. The first frame includes the HUD; the other views isolate the 3D scene. Reload images show each gun 45% through its animation. <a href="report.json">Raw review report</a></p><div class="grid" id="gallery"></div></main>
<script>for(const name of ['gameplay-hud','street','clinic-exterior','clinic-interior','armory-exterior','armory-interior','extraction','infected','reload-rifle','reload-smg','reload-shotgun','reload-lmg','reload-marksman','reload-revolver']){const figure=document.createElement('figure'),image=document.createElement('img'),caption=document.createElement('figcaption');image.src=`${name}.png`;image.alt=name.replaceAll('-',' ');image.loading='lazy';caption.textContent=name.replaceAll('-',' ');figure.append(image,caption);document.getElementById('gallery').append(figure);}</script></html>
